# NOTE: Only supports options marked as "Supported in Redoc CE"
# See https://redocly.com/docs/cli/configuration/ for more information.

extends:
  - recommended

rules:
  operation-2xx-response: off
  operation-4xx-response: off

theme:
  # See https://redocly.com/docs/redoc/config/
  openapi:
    disableSearch: true
    hideSchemaTitles: true
    pagination: "section"
    theme:
      colors:
        border:
          dark: '#334155'
        accent:
          main: '#2563eb'
        gray:
          50: '#1e293b'
          100: '#334155'
        success:
          main: '#088869'
          contrastText: '#06644d'
        error:
          main: '#2563eb'
        http:
          basic: '#334155'
          delete: '#2563eb'
          get: '#088869'
          link: '#088869'
          post: '#2563eb'

      typography:
        fontFamily: '"Inter", sans-serif'
        code:
          backgroundColor: "transparent"

      sidebar:
        width: "300px"
        backgroundColor: "transparent"
      rightPanel:
        backgroundColor: "#0f172a"
      schema:
        linesColor: '#334155'
        arrow:
          color: '#2563eb'
